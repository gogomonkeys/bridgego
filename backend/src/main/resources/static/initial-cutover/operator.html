<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>BridgeGo｜首次季度切換</title><link rel="stylesheet" href="/initial-cutover/operator.css"><script src="https://accounts.google.com/gsi/client" async defer></script><script src="/initial-cutover/operator.js" defer></script></head>
<body><main><header><p>BridgeGo · 管理</p><h1>首次季度切換</h1><p>每一步先預覽，再由你確認。尚未確認的結果不會自動重試。</p></header>
<ol id="steps"><li id="step-prepare">1. 唯讀檢查</li><li id="step-metadata">2. 管理紀錄</li><li id="step-history">3. 歷史紀錄</li><li id="step-activation">4. 明確啟用</li></ol>
<section><h2>目前狀態</h2><p id="status" role="status" aria-live="polite">正在讀取設定，尚未送出操作。</p><p id="detail" class="muted"></p></section>
<section><h2 id="action-title">操作</h2><div id="deployment-field"><label for="deployment">本次 Render 部署 ID</label><input id="deployment" type="text" placeholder="dep-…" maxlength="100" autocomplete="off" spellcheck="false"><p class="muted">此 ID 僅供核對。部署狀態仍由獨立控制端驗證。</p></div><dl id="preview"></dl><div id="checks"></div><button id="action" type="button" disabled>準備中</button><p id="reason" class="muted">設定尚未載入。</p><div id="google-wrap" hidden><p>請完成這一次 Google 管理者驗證。</p><div id="google-button"></div></div></section>
<section><h2>可複製結果</h2><pre id="result">尚無結果。</pre><button id="copy" type="button">複製結果</button><p id="copy-status" class="muted" role="status"></p></section><footer>若結果未確認，請保留畫面並聯絡管理者。不要重試、重新整理或重啟。</footer></main></body></html>
