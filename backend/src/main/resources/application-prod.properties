# Render terminates HTTPS; Java only listens on the platform's internal HTTP port.
server.address=0.0.0.0
server.port=${PORT:8080}
# Never trust arbitrary client-supplied forwarding headers for identity/rate limits.
server.forward-headers-strategy=none
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
bridge.public-origin=${PUBLIC_ORIGIN:}
server.tomcat.threads.max=32
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=128
server.tomcat.accept-count=32
server.tomcat.connection-timeout=10s
server.max-http-request-header-size=16KB
