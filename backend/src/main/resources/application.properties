server.address=127.0.0.1
server.port=8080
server.error.include-message=never
spring.application.name=bridge-room-successor
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.web.resources.cache.cachecontrol.no-cache=true
# Maven 3.10 reproducible archives share a fixed 1980 timestamp across releases.
# It is not a content validator: old SW/HTML clients must receive current bytes.
spring.web.resources.cache.use-last-modified=false
